<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      id="mindflow-preferences-pane" class="mindflow-prefs-container"
      onload="MindFlow_Preferences.init(window)">
  <html:header class="mindflow-pref-header">
    <html:div class="mindflow-pref-title-area">
      <html:img class="mindflow-pref-brand-icon" src="chrome://mindflow/content/icons/icon-accent.svg" width="22" height="22" alt="" />
      <html:h1 class="mindflow-pref-title">Zotero MindFlow</html:h1>
      <html:span class="mindflow-pref-version">v12.0.0</html:span>
    </html:div>
    <html:button id="mindflow-btn-open-workspace" class="mindflow-btn-primary" type="button">打开导图工作台</html:button>
  </html:header>
  <html:p id="mindflow-pref-status" class="mindflow-pref-status" role="status" aria-live="polite">正在加载设置项…</html:p>

  <!-- 1. 文献与 PDF 阅读协同 -->
  <html:details id="mindflow-group-literature" class="mindflow-setting-card" open="true">
    <html:summary class="mindflow-card-summary">
      <html:h2 class="mindflow-card-title">文献与 PDF 阅读协同</html:h2>
    </html:summary>
    <html:div class="mindflow-card-body">
      <html:div id="mindflow-pref-literature" class="mindflow-pref-content" />
    </html:div>
  </html:details>

  <!-- 2. AI 论文研究与智能导图（可选） -->
  <html:details id="mindflow-group-ai" class="mindflow-setting-card">
    <html:summary class="mindflow-card-summary">
      <html:h2 class="mindflow-card-title">AI 论文研究与智能导图（可选）</html:h2>
    </html:summary>
    <html:div class="mindflow-card-body">
      <html:div id="mindflow-pref-ai" class="mindflow-pref-content" />
    </html:div>
  </html:details>

  <!-- 3. 工作台界面与工具栏 -->
  <html:details id="mindflow-group-interface" class="mindflow-setting-card">
    <html:summary class="mindflow-card-summary">
      <html:h2 class="mindflow-card-title">工作台界面与工具栏</html:h2>
    </html:summary>
    <html:div class="mindflow-card-body">
      <html:div id="mindflow-pref-interface" class="mindflow-pref-content" />
    </html:div>
  </html:details>

  <!-- 4. 新建导图与节点编辑 -->
  <html:details id="mindflow-group-editing" class="mindflow-setting-card">
    <html:summary class="mindflow-card-summary">
      <html:h2 class="mindflow-card-title">新建导图与节点编辑</html:h2>
    </html:summary>
    <html:div class="mindflow-card-body">
      <html:div id="mindflow-pref-editing" class="mindflow-pref-content" />
    </html:div>
  </html:details>

  <!-- 5. 本地保存与历史快照 -->
  <html:details id="mindflow-group-backup" class="mindflow-setting-card">
    <html:summary class="mindflow-card-summary">
      <html:h2 class="mindflow-card-title">本地保存与历史快照</html:h2>
    </html:summary>
    <html:div class="mindflow-card-body">
      <html:div id="mindflow-pref-backup" class="mindflow-pref-content" />
    </html:div>
  </html:details>

  <!-- 6. WebDAV 备份与同步（可选） -->
  <html:details id="mindflow-group-webdav" class="mindflow-setting-card">
    <html:summary class="mindflow-card-summary">
      <html:h2 class="mindflow-card-title">WebDAV 备份与同步（可选）</html:h2>
    </html:summary>
    <html:div class="mindflow-card-body">
      <html:div id="mindflow-pref-webdav" class="mindflow-pref-content" />
    </html:div>
  </html:details>

  <!-- 7. 快捷键指南与系统重置 -->
  <html:details id="mindflow-group-shortcuts" class="mindflow-setting-card mindflow-pref-group-last">
    <html:summary class="mindflow-card-summary">
      <html:h2 class="mindflow-card-title">快捷键指南与系统重置</html:h2>
    </html:summary>
    <html:div class="mindflow-card-body">
      <html:div id="mindflow-pref-shortcuts" class="mindflow-pref-content">
        <html:div class="mindflow-shortcuts-grid">
          <html:div class="mindflow-shortcut-item">
            <html:kbd class="mindflow-kbd">Tab</html:kbd>
            <html:span class="mindflow-shortcut-label">添加子节点</html:span>
          </html:div>
          <html:div class="mindflow-shortcut-item">
            <html:kbd class="mindflow-kbd">Enter</html:kbd>
            <html:span class="mindflow-shortcut-label">添加同级节点</html:span>
          </html:div>
          <html:div class="mindflow-shortcut-item">
            <html:kbd class="mindflow-kbd">Space</html:kbd>
            <html:span class="mindflow-shortcut-label">快速编辑节点（或双击）</html:span>
          </html:div>
          <html:div class="mindflow-shortcut-item">
            <html:kbd class="mindflow-kbd">Delete</html:kbd>
            <html:span class="mindflow-shortcut-label">删除选定节点</html:span>
          </html:div>
        </html:div>
        <html:div class="mindflow-form-row" style="margin-top: 10px; border-bottom: none;">
          <html:div class="mindflow-form-label-wrap">
            <html:span class="mindflow-form-label">恢复默认设置</html:span>
            <html:span class="mindflow-form-desc">仅重置插件偏好设置，不会删除导图附件、文献条目或历史快照</html:span>
          </html:div>
          <html:button id="mindflow-btn-reset-defaults" class="mindflow-btn-secondary" type="button">恢复 MindFlow 默认设置</html:button>
        </html:div>
      </html:div>
    </html:div>
  </html:details>
</vbox>
