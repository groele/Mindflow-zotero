<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      id="mindflow-preferences-pane" class="mindflow-prefs-container"
      onload="MindFlow_Preferences.init(window)">
  <html:header class="mindflow-pref-header">
    <html:h1>MindFlow</html:h1>
    <html:button id="mindflow-btn-open-workspace" type="button">打开导图工作台</html:button>
  </html:header>
  <html:p id="mindflow-pref-status" class="mindflow-pref-status" role="status" aria-live="polite">正在加载设置项…</html:p>
  <groupbox id="mindflow-group-literature" class="mindflow-pref-group">
    <html:h2 class="mindflow-group-title">文献与 PDF 阅读协同</html:h2>
    <html:div id="mindflow-pref-literature" class="mindflow-pref-content" />
  </groupbox>
  <groupbox id="mindflow-group-ai" class="mindflow-pref-group">
    <html:h2 class="mindflow-group-title">AI 论文研究导图（可选）</html:h2>
    <html:div id="mindflow-pref-ai" class="mindflow-pref-content" />
  </groupbox>
  <groupbox id="mindflow-group-interface" class="mindflow-pref-group">
    <html:h2 class="mindflow-group-title">工作台界面与工具栏</html:h2>
    <html:div id="mindflow-pref-interface" class="mindflow-pref-content" />
  </groupbox>
  <groupbox id="mindflow-group-editing" class="mindflow-pref-group">
    <html:h2 class="mindflow-group-title">新建导图与节点编辑</html:h2>
    <html:div id="mindflow-pref-editing" class="mindflow-pref-content" />
  </groupbox>
  <groupbox id="mindflow-group-backup" class="mindflow-pref-group">
    <html:h2 class="mindflow-group-title">本地保存与历史快照</html:h2>
    <html:div id="mindflow-pref-backup" class="mindflow-pref-content" />
  </groupbox>
  <groupbox id="mindflow-group-webdav" class="mindflow-pref-group">
    <html:h2 class="mindflow-group-title">WebDAV 备份（可选）</html:h2>
    <html:div id="mindflow-pref-webdav" class="mindflow-pref-content" />
  </groupbox>
  <groupbox id="mindflow-group-shortcuts" class="mindflow-pref-group mindflow-pref-group-last">
    <html:h2 class="mindflow-group-title">快捷操作与重置</html:h2>
    <html:div class="mindflow-pref-content">
      <html:p class="mindflow-pref-desc">在工作台按 Tab 添加子节点，Enter 添加同级节点。更多快捷键可在工作台内查看。</html:p>
      <html:button id="mindflow-btn-reset-defaults" type="button">恢复 MindFlow 默认设置</html:button>
      <html:p class="mindflow-pref-desc">只重置插件设置，不删除导图、附件或历史快照。</html:p>
    </html:div>
  </groupbox>
</vbox>
