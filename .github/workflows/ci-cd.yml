name: MindFlow CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Test, Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Core Test Suites
        run: npm test

      - name: Build Chrome Extension (MV3)
        run: npm run build

      - name: Package Extension for Chrome Web Store
        run: node scripts/package-extension.js

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mindflow-webstore-zip
          path: dist-zip/*.zip
          retention-days: 14

  release:
    name: GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Zotero XPI
        run: npm run build:zotero

      - name: Attach Zotero XPI to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-zip/*.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
