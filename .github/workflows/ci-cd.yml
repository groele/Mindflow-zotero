name: MindFlow CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Test, Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Core Test Suites
        run: npm test

      - name: Build Chrome Extension (MV3)
        run: npm run build

      - name: Package Extension for Chrome Web Store
        run: node scripts/package-extension.js

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mindflow-webstore-zip
          path: dist-zip/*.zip
          retention-days: 14

  release:
    name: GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    concurrency:
      group: zotero-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Zotero tag and update manifest
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath zotero/manifest.json -Raw | ConvertFrom-Json
          $updates = Get-Content -LiteralPath zotero/update.json -Raw | ConvertFrom-Json
          $entry = $updates.addons.PSObject.Properties['mindflow@groele.org'].Value.updates[0]
          $expectedTag = "v$($manifest.version)"
          $expectedUrl = "https://github.com/groele/Mindflow-zotero/releases/download/$expectedTag/mindflow-zotero-$($manifest.version).xpi"
          if ($env:GITHUB_REF_NAME -ne $expectedTag -or $entry.version -ne $manifest.version -or $entry.update_link -ne $expectedUrl) {
            throw 'Zotero tag, manifest version, and update link must match.'
          }

      - name: Build Zotero XPI
        run: npm run build:zotero

      - name: Locate Zotero release notes
        id: notes
        shell: pwsh
        run: |
          $notesPath = "docs/releases/zotero-$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notesPath)) {
            throw "Missing release notes: $notesPath"
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "path=$notesPath"

      - name: Attach Zotero XPI to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MindFlow for Zotero ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist-zip/*.xpi
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
